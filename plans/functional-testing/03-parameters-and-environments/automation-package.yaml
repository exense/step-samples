---
# Functional testing sample 03 - Parameters and environments
version: "1.3.0"
name: "functional-03-parameters-and-environments"

parameters:
  # One entry per environment, selected by the "env" execution parameter
  - key: "shopUrl"
    value: "https://dev.shop.example"
    activationScript: "env == 'DEV'"
    priority: 10
  - key: "shopUrl"
    value: "https://test.shop.example"
    activationScript: "env == 'TEST'"
    priority: 10
  - key: "shopUrl"
    value: "https://shop.example"
    activationScript: "env == 'PROD'"
    priority: 10
  # Default, used when no environment-specific entry is active
  - key: "shopUrl"
    value: "http://localhost:8080"
    priority: 1
  # Built from another parameter. Technical setting: read by the keyword as a property, not passed as an input
  - key: "shopApiUrl"
    value: "${shopUrl}/api"
  - key: "shopUser"
    value: "shop-tester"
  - key: "shopPassword"
    value: "demo-secret"
    protectedValue: true

plans:
  - name: "A - Environment-specific parameters"
    root:
      testCase:
        nodeName: "Application opens"
        children:
          - callKeyword:
              keyword: "Open Application"
              inputs:
                - url: "${shopUrl}"
              children:
                - assert:
                    actual: "title"
                    operator: EQUALS
                    expected: "Web shop"

  - name: "B - Technical settings as keyword properties"
    root:
      testCase:
        nodeName: "Shop API is available"
        children:
          - callKeyword:
              keyword: "Check Shop API"
              children:
                - assert:
                    actual: "apiUrl"
                    operator: EQUALS
                    expected: "${shopUrl}/api"
                - assert:
                    actual: "status"
                    operator: EQUALS
                    expected: "UP"

  - name: "C - Protected parameters"
    root:
      testCase:
        nodeName: "User can log in"
        children:
          - callKeyword:
              keyword: "Login"
              inputs:
                - username: "${shopUser}"
                - password: "${shopPassword}"
              children:
                - assert:
                    actual: "status"
                    operator: EQUALS
                    expected: "LOGGED_IN"

keywords:
  - GeneralScript:
      name: "Open Application"
      scriptLanguage: groovy
      scriptFile: keywords/openApplication.groovy
  - GeneralScript:
      name: "Check Shop API"
      scriptLanguage: groovy
      scriptFile: keywords/checkShopApi.groovy
  - GeneralScript:
      name: "Login"
      scriptLanguage: groovy
      scriptFile: keywords/login.groovy
