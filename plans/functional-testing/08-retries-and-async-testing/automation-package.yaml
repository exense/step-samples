---
# Functional testing sample 08 - Retries and async testing
version: "1.3.0"
name: "functional-08-retries-and-async-testing"

plans:
  - name: "A - Retry a flaky step"
    root:
      testCase:
        nodeName: "Dashboard opens"
        children:
          - retryIfFails:
              maxRetries: 3
              gracePeriod: 500
              children:
                - callKeyword:
                    keyword: "Load Dashboard"

  - name: "B - Poll until a condition is met"
    root:
      testCase:
        nodeName: "Order status becomes SHIPPED"
        children:
          - callKeyword:
              keyword: "Place Order"
              children:
                - set:
                    key: "orderId"
                    value: "${output.orderId}"
          # Poll until the assert passes, at most 10 times or 30 seconds
          - retryIfFails:
              maxRetries: 10
              gracePeriod: 1000
              timeout: 30000
              reportLastTryOnly: true
              children:
                - callKeyword:
                    keyword: "Get Order Status"
                    inputs:
                      - orderId: "${orderId}"
                    children:
                      - assert:
                          actual: "status"
                          operator: EQUALS
                          expected: "SHIPPED"

  - name: "C - Wait for an event"
    root:
      testCase:
        nodeName: "Shipping notification is published"
        children:
          - callKeyword:
              keyword: "Place Order"
              children:
                - set:
                    key: "orderId"
                    value: "${output.orderId}"
          # Publishes the event; usually done by another plan running in parallel
          - callKeyword:
              keyword: "EBC_Put"
              inputs:
                - eventGroup: "order-shipped"
                - eventName: "${orderId}"
                - payloadAsJson: '{"orderId":"${orderId}","status":"SHIPPED"}'
          - waitForEvent:
              group: "order-shipped"
              name: "${orderId}"
              pollingSpeed: 500
              timeout: 30000

keywords:
  - GeneralScript:
      name: "Load Dashboard"
      scriptLanguage: groovy
      scriptFile: keywords/loadDashboard.groovy
  - GeneralScript:
      name: "Place Order"
      scriptLanguage: groovy
      scriptFile: keywords/placeOrder.groovy
  - GeneralScript:
      name: "Get Order Status"
      scriptLanguage: groovy
      scriptFile: keywords/getOrderStatus.groovy
